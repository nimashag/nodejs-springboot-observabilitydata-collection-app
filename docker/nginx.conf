resolver 127.0.0.11 valid=30s;

server {
  listen 80;

  # Proxy orders API routes to orders backend service
  location /api/orders {
    set $backend "orders-service:3002";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # Proxy restaurants API routes to restaurants backend service
  location /api/restaurants {
    set $backend "restaurants-service:3001";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  } 

  # Proxy uploads routes to restaurants backend service
  location /uploads {
    set $backend "restaurants-service:3001";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  } 

  # Proxy users API routes to users backend service
  location /api/auth {
    set $backend "users-service:3003";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }   

  # Proxy delivery API routes to delivery backend service
  location /api/delivery {
    set $backend "delivery-service:3004";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }  

  # Proxy log aggregation API routes
  location ~ ^/api/(logs|templates|traces|pii|train) {
    set $backend "log-aggregation-service:3005";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy log aggregation health check
  location /health {
    set $backend "log-aggregation-service:3005";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy alert-agent-data-collect-service health check (must come before regex pattern)
  location /api/health {
    set $backend "alert-agent-data-collect-service:3008";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy alert-agent-data-collect-service API routes
  location ~ ^/api/(analysis|alerts|recommendations|routing|adaptive-config|ml-report|ml-stats|ml-agent-results|ml-classified-alerts|ml-predictions-results|ml-false-positives|realtime-stats|summary|analysis-summary|adaptive-learning|correlations|incidents|predictions|deduplication|contextual-thresholds|remediation|experiments|features|applied-thresholds|apply-threshold|send-email) {
    set $backend "alert-agent-data-collect-service:3008";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy logs dashboard frontend
  location /logs {
    set $backend "logs-dashboard-frontend:80";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy observability dashboard frontend (unified logs and alerts)
  # Strip /observability prefix and forward to root (SPA expects root path)
  location /observability/ {
    set $backend "observability-dashboard-frontend:80";
    proxy_pass http://$backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy React app routes to frontend service
  location / {
    set $backend "frontend-service:80";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

