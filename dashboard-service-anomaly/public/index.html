<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anomaly Incident Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f6f7fb; }
    .page-title { font-weight: 800; letter-spacing: -0.5px; }
    .subtle { color: #6b7280; font-size: 0.9rem; }
    .card { border: 0; border-radius: 16px; box-shadow: 0 10px 30px rgba(20,20,50,.06); }
    .mono { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: .9rem; }
    .table thead th { position: sticky; top: 0; background: #fff; }
  </style>
</head>

<body>
<div class="container py-4">

  <div class="mb-4">
    <h1 class="page-title">Anomaly Incident Dashboard</h1>
    <div class="subtle" id="meta">Loading...</div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3">
        <div class="subtle mb-2">Counts</div>
        <div id="counts"></div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card p-3">
        <div class="subtle mb-2">Incident Story (Auto-Generated)</div>
        <div id="story"></div>
      </div>
    </div>
  </div>

  <div class="card p-3">
    <div class="d-flex justify-content-between mb-2">
      <h5>Incidents</h5>
      <div class="subtle">Showing anomalous request groups</div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Request ID</th>
            <th>Service</th>
            <th>Status</th>
            <th>Level</th>
            <th>Level Encoded</th>
            <th>Events</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody id="incidentsTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
